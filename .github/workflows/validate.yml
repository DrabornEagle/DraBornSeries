name: DraBornSeries checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dbs-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build:web
      - name: Validate Android JS bundle (no APK)
        run: npm run export:android
      - uses: actions/upload-artifact@v4
        with:
          name: DraBornSeries-web
          path: dist
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start isolated local Supabase
        run: npx --yes supabase@2.118.0 start
      - name: Validate migrations and seed in local database
        run: npx --yes supabase@2.118.0 db reset --local
      - name: Apply application release metadata only
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/releases/v071.sql
      - name: Verify ledger, RLS and progress isolation
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f tests/database-security.sql
      - name: Verify Studio media ownership, roles and registration
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f tests/studio-media-security.sql
      - name: Verify Stream upload binding and callback ordering
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f tests/stream-upload-security.sql
      - name: Verify subtitle RLS, repeat saves and portrait defaults
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f tests/subtitle-security.sql
      - name: Verify R2 import, series direction, free/paid media and Google profiles
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f tests/r2-studio-security.sql
      - name: Verify VIP/coin promotions, title ranking and private caption jobs
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f tests/v071-promotions-security.sql
