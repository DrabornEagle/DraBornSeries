name: DraBornSeries checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dbs-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build:web
      - name: Validate Android JS bundle (no APK)
        run: npm run export:android
      - name: Verify commerce screens in a mobile browser
        run: |
          npm install --prefix "$RUNNER_TEMP/dbs-web-ui" --no-audit --no-fund playwright@1.58.2
          node "$RUNNER_TEMP/dbs-web-ui/node_modules/playwright/cli.js" install --with-deps chromium
          mkdir -p "$RUNNER_TEMP/dbs-web-preview"
          ln -s "$GITHUB_WORKSPACE/dist" "$RUNNER_TEMP/dbs-web-preview/DraBornSeries"
          python3 -m http.server 8765 --directory "$RUNNER_TEMP/dbs-web-preview" > "$RUNNER_TEMP/dbs-web-preview.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for ATTEMPT in $(seq 1 30); do
            if curl --silent --fail http://localhost:8765/DraBornSeries/ > /dev/null; then break; fi
            sleep 1
          done
          NODE_PATH="$RUNNER_TEMP/dbs-web-ui/node_modules" node scripts/web-commerce-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DraBornSeries-commerce-screen-checks
          path: artifacts/web-commerce
      - uses: actions/upload-artifact@v4
        with:
          name: DraBornSeries-web
          path: dist
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start isolated local Supabase
        run: npx --yes supabase@2.118.0 start
      - name: Validate migrations and seed in local database
        run: npx --yes supabase@2.118.0 db reset --local
      - name: Apply released products and latest application metadata
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/releases/v077.sql -f supabase/releases/v0772.sql
      - name: Verify ledger, RLS and progress isolation
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f tests/database-security.sql
      - name: Verify Studio media ownership, roles and registration
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f tests/studio-media-security.sql
      - name: Verify Stream upload binding and callback ordering
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f tests/stream-upload-security.sql
      - name: Verify subtitle RLS, repeat saves and portrait defaults
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f tests/subtitle-security.sql
      - name: Verify R2 import, series direction, free/paid media and Google profiles
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f tests/r2-studio-security.sql
      - name: Verify VIP/coin promotions, title ranking and private caption jobs
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f tests/v071-promotions-security.sql
      - name: Verify approved comments, Play lifecycle and signed ad rewards
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f tests/v072-billing-ads-security.sql
      - name: Verify single subscription, plan replacement and test periods
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f tests/v0772-subscription-security.sql
      - name: Verify coin credit, account binding, replay and refunds
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f tests/v075-coins-security.sql
  edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6
      - name: Typecheck deployed Edge functions
        run: deno check --node-modules-dir=none supabase/functions/dbs-api/index.ts supabase/functions/dbs-play-verify/index.ts supabase/functions/dbs-play-rtdn/index.ts supabase/functions/dbs-ad-verify/index.ts
