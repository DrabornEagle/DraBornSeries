name: DraBornSeries Android release validation
on:
  workflow_dispatch:
# APK/AAB builds are manual while the owner tests this revision in Expo Go.
permissions:
  contents: read
  actions: write
concurrency:
  group: dbs-native-android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore encrypted Secrets or privately create the first release key
        env:
          DBS_ALLOW_UNSIGNED_CI: "1"
          GH_TOKEN: ${{ github.token }}
          DBS_RELEASE_KEYSTORE_BASE64: ${{ secrets.DBS_RELEASE_KEYSTORE_BASE64 }}
          DBS_RELEASE_SIGNING_JSON: ${{ secrets.DBS_RELEASE_SIGNING_JSON }}
        run: python3 scripts/prepare-release-signing.py
      - name: Save only the encrypted owner-only signing backup
        uses: actions/upload-artifact@v4
        with:
          name: DraBornSeries-release-signing-encrypted
          path: artifacts/signing-encrypted/
          retention-days: 90
      - run: npm ci
      - name: Validate TypeScript
        run: npm run typecheck
      - name: Generate native Android with real splash, Billing, AdMob and release signing
        run: |
          npm pack expo-template-bare-minimum@58.0.10 --pack-destination "$RUNNER_TEMP" --silent
          npx expo prebuild --platform android --no-install --template "$RUNNER_TEMP/expo-template-bare-minimum-58.0.10.tgz"
      - name: Compile APK and AAB with embedded JavaScript
        working-directory: android
        run: ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,x86_64 --max-workers=2
      - name: Prepare release packages and a temporary signed APK for playback validation
        run: |
          mkdir -p artifacts/release
          if [ "${DBS_UNSIGNED_RELEASE:-0}" = "1" ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk artifacts/release/DraBornSeries-v0.7.4-unsigned.apk
            cp android/app/build/outputs/bundle/release/app-release.aab artifacts/release/DraBornSeries-v0.7.4-unsigned.aab
            keytool -genkeypair -keystore "$RUNNER_TEMP/dbs-smoke.jks" -storepass android -keypass android -alias ci-smoke -keyalg RSA -validity 2 -dname 'CN=Temporary CI playback validation'
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$RUNNER_TEMP/dbs-smoke.jks" --ks-pass pass:android --key-pass pass:android --out "$RUNNER_TEMP/dbs-smoke.apk" artifacts/release/DraBornSeries-v0.7.4-unsigned.apk
            echo "DBS_SMOKE_APK=$RUNNER_TEMP/dbs-smoke.apk" >> "$GITHUB_ENV"
            printf 'Unsigned packages. Delivery requires the pinned owner certificate; the temporary CI certificate is only for emulator installation.\n' > artifacts/release/SIGNING.txt
          else
            cp android/app/build/outputs/apk/release/app-release.apk artifacts/release/DraBornSeries-v0.7.4-release.apk
            cp android/app/build/outputs/bundle/release/app-release.aab artifacts/release/DraBornSeries-v0.7.4-release.aab
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs artifacts/release/DraBornSeries-v0.7.4-release.apk > artifacts/release/APK-signature.txt
            jarsigner -verify artifacts/release/DraBornSeries-v0.7.4-release.aab > artifacts/release/AAB-signature.txt
          fi
          sha256sum artifacts/release/*.apk artifacts/release/*.aab > artifacts/release/SHA256SUMS.txt
      - name: Save native dependency and release diagnostics
        if: always()
        run: |
          mkdir -p artifacts/diagnostics
          cp android/app/build/outputs/mapping/release/mapping.txt artifacts/diagnostics/R8-mapping.txt || true
          cp android/app/build/outputs/logs/manifest-merger-release-report.txt artifacts/diagnostics/manifest-merger.txt || true
          if [ -d android ]; then
            cd android
            ./gradlew :app:dependencyInsight --configuration releaseRuntimeClasspath --dependency androidx.work:work-runtime --no-daemon > ../artifacts/diagnostics/WorkManager.txt || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DraBornSeries-v0.7.4-native-diagnostics
          path: artifacts/diagnostics/
      - uses: actions/upload-artifact@v4
        with:
          name: DraBornSeries-v0.7.4-release-packages
          path: artifacts/release/
          retention-days: 90
      - name: Enable accelerated Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and cold-start the release build
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 2048
          script: bash scripts/android-smoke.sh
      - name: Save Android startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DraBornSeries-v0.7.4-Android-startup
          path: artifacts/smoke/
