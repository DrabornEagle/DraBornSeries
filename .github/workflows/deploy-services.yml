name: DraBornSeries service deployment
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/dbs-api/**'
      - 'supabase/functions/dbs-play-verify/**'
      - 'supabase/functions/dbs-play-rtdn/**'
      - 'supabase/functions/dbs-ad-verify/**'
      - 'scripts/configure-r2.mjs'
      - 'cloudflare/r2-worker.js'
      - '.github/workflows/deploy-services.yml'
permissions:
  contents: read
concurrency:
  group: dbs-r2-setup
  cancel-in-progress: false
jobs:
  r2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check configured access without printing credentials
        id: access
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          const missing=['SUPABASE_ACCESS_TOKEN'].filter(name=>!process.env[name]);
          appendFileSync(process.env.GITHUB_OUTPUT,`configured=${missing.length===0}\n`);
          if(missing.length){console.log('::warning::API deployment via Actions is unavailable: '+missing.join(', ')+'.');appendFileSync(process.env.GITHUB_STEP_SUMMARY,'API deployment via Actions unavailable. Worker code can still be deployed independently.\n');}
          JS
      - uses: actions/setup-node@v4
        if: steps.access.outputs.configured == 'true'
        with:
          node-version: 22
      - if: steps.access.outputs.configured == 'true'
        run: npm ci
      - if: steps.access.outputs.configured == 'true'
        run: npm run check
      - name: Deploy authenticated media, Play and signed ad services
        if: steps.access.outputs.configured == 'true'
        run: |
          npx --yes supabase@2.118.0 functions deploy dbs-api --project-ref xpdiwyxnnrmyvpcqwuyb
          npx --yes supabase@2.118.0 functions deploy dbs-play-verify --project-ref xpdiwyxnnrmyvpcqwuyb
          npx --yes supabase@2.118.0 functions deploy dbs-play-rtdn --project-ref xpdiwyxnnrmyvpcqwuyb
          npx --yes supabase@2.118.0 functions deploy dbs-ad-verify --project-ref xpdiwyxnnrmyvpcqwuyb
      - name: Deploy R2 Worker while retaining its existing bucket and secrets
        run: node scripts/configure-r2.mjs
