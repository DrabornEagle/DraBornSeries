name: DraBornSeries service deployment
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/dbs-api/**'
      - 'scripts/configure-stream.mjs'
      - 'docs/blender-film-catalog.json'
      - '.github/workflows/deploy-services.yml'
permissions:
  contents: read
concurrency:
  group: dbs-stream-setup
  cancel-in-progress: false
jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check configured access without printing credentials
        id: access
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          const missing=['SUPABASE_ACCESS_TOKEN','CLOUDFLARE_ACCOUNT_ID','CLOUDFLARE_API_TOKEN'].filter(name=>!process.env[name]);
          appendFileSync(process.env.GITHUB_OUTPUT,`configured=${missing.length===0}\n`);
          if(missing.length){console.log('::warning::Stream setup is blocked: '+missing.join(', ')+' not configured in the production environment.');appendFileSync(process.env.GITHUB_STEP_SUMMARY,'Stream setup pending. Missing secret names: '+missing.join(', ')+'. No catalog UIDs were fabricated.\n');}
          JS
      - uses: actions/setup-node@v4
        if: steps.access.outputs.configured == 'true'
        with:
          node-version: 22
      - if: steps.access.outputs.configured == 'true'
        run: npm ci
      - if: steps.access.outputs.configured == 'true'
        run: npm run check
      - name: Deploy the authenticated API and signed webhook handler
        if: steps.access.outputs.configured == 'true'
        run: npx --yes supabase@2.118.0 functions deploy dbs-api --project-ref xpdiwyxnnrmyvpcqwuyb
      - name: Configure Stream, webhook, server secrets and catalog UIDs
        if: steps.access.outputs.configured == 'true'
        run: node scripts/configure-stream.mjs
