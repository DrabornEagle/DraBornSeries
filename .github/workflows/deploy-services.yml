name: DraBornSeries service deployment
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  edge:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Check configured access
        run: test -n "$SUPABASE_ACCESS_TOKEN"
      - run: npx supabase functions deploy dbs-api --project-ref xpdiwyxnnrmyvpcqwuyb
      - run: npx supabase functions deploy dbs-play-verify --project-ref xpdiwyxnnrmyvpcqwuyb
  worker:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/workers
          command: deploy
