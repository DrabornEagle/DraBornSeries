name: R2 Turkish subtitles
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/subtitles.yml'
      - 'scripts/auto-subtitles.py'
      - 'scripts/subtitles-requirements.txt'
      - 'supabase/functions/dbs-api/caption-auth.ts'
permissions:
  contents: read
  id-token: write
concurrency:
  group: dbs-r2-subtitles
  cancel-in-progress: false
jobs:
  captions:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HF_HOME: ${{ github.workspace }}/.caption-models
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Claim one pending upload using GitHub OIDC
        id: jobs
        run: python scripts/auto-subtitles.py claim
      - uses: actions/cache@v4
        if: steps.jobs.outputs.pending == 'true'
        with:
          path: .caption-models
          key: dbs-subtitle-small-opus-en-tr-v1
      - name: Install speech and translation tools
        if: steps.jobs.outputs.pending == 'true'
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          python -m pip install -r scripts/subtitles-requirements.txt
      - name: Verify real speech recognition and Turkish translation
        if: steps.jobs.outputs.pending == 'true' && github.event_name == 'push'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng
          python scripts/auto-subtitles.py selftest
      - name: Generate and save Turkish captions
        if: steps.jobs.outputs.pending == 'true'
        run: python scripts/auto-subtitles.py run
      - name: Release a failed job for retry
        if: failure() && steps.jobs.outputs.pending == 'true'
        run: python scripts/auto-subtitles.py fail
